<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadow filter for crisp visibility in both light and dark browser tabs -->
    <filter id="swanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Background Badge for perfect favicon tab contrast -->
  <rect width="512" height="512" rx="128" fill="#F0F5F2" />

  <g transform="translate(18, 12)" filter="url(#swanShadow)">
    <!-- 1. Top Feather / Wing (Soft Periwinkle / Lavender Blue) -->
    <path
      d="M 195 210 C 165 210 145 230 145 255 C 145 278 165 292 195 292 L 320 292 C 342 292 355 275 355 265 C 335 238 275 210 195 210 Z"
      fill="#A8C1FD"
    />

    <!-- 2. Middle Feather / Wing (Midnight Navy) -->
    <path
      d="M 165 250 C 135 250 115 270 115 295 C 115 318 135 332 165 332 L 345 332 C 356 332 360 320 360 310 C 338 280 270 250 165 250 Z"
      fill="#1C233C"
    />

    <!-- 3. Bottom Feather / Wing (Soft Periwinkle / Lavender Blue) -->
    <path
      d="M 185 295 C 155 295 135 315 135 340 C 135 363 155 378 185 378 L 315 378 C 345 378 355 352 355 338 C 322 318 255 295 185 295 Z"
      fill="#A8C1FD"
    />

    <!-- 4. Swan Neck & Head (Midnight Navy) -->
    <path
      d="M 285 230 
         C 285 170 315 145 345 145 
         C 378 145 392 170 392 190 
         C 392 204 388 214 396 222 
         L 392 228 
         C 383 218 380 205 380 190 
         C 380 174 370 162 345 162 
         C 325 162 305 178 305 230 
         C 305 275 340 305 355 338 
         C 358 348 352 358 342 358 
         C 322 338 285 295 285 230 Z"
      fill="#1C233C"
    />
  </g>
</svg>
